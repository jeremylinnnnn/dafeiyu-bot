# 可选覆盖文件：显式启用「只读文件凭证」。
#
# 不启用时不要带这个文件，后端保持原来的「仅本次运行」行为，
# 凭证由人在面板里填写。
#
# 启用方式：
#   docker compose -f docker-compose.yml -f docker-compose.credentials.yml up -d
#
# 前置条件（缺一个都会明确报错并跳过自动连接，不会静默降级）：
#   1. 两个文件都必须先存在。Docker 对不存在的 bind 源会创建目录，
#      而程序只接受普通文件，会报「必须是普通文件」。
#   2. 权限 0400 或 0600。属组/其他用户不得有任何权限位。
#   3. 属主必须是容器运行用户 UID 10001。只设 0600 但属主不对，
#      非 root 进程照样读不到——这一点最容易漏。
#
#   sudo install -d -m 700 -o 10001 -g 10001 ~/dafeiyu/secrets
#   sudo install -m 400 -o 10001 -g 10001 /dev/null ~/dafeiyu/secrets/onebot-token
#   sudo install -m 400 -o 10001 -g 10001 /dev/null ~/dafeiyu/secrets/deepseek-key
#   然后分别写入内容（用编辑器，不要用 echo 留下 shell 历史）。

services:
  backend:
    environment:
      DAFEIYU_ONEBOT_TOKEN_FILE: /run/secrets/onebot-token
      DAFEIYU_DEEPSEEK_KEY_FILE: /run/secrets/deepseek-key
    volumes:
      - ./secrets/onebot-token:/run/secrets/onebot-token:ro
      - ./secrets/deepseek-key:/run/secrets/deepseek-key:ro
