name: dafeiyu

# 网络要点：
#   - napcat 用 bridge，端口只发布到宿主机回环 127.0.0.1
#   - backend 必须用 host 网络，否则容器内的 127.0.0.1 指向容器自身，
#     连不到 NapCat 的 3001（QQPolicy.validate() 要求端点是回环地址）
#   - backend 用 host 网络后不能再写 ports，写了 compose 会直接报错

services:
  napcat:
    image: mlikiowa/napcat-docker@sha256:41b1a8e10953065f4796ab19c0c8760cd3175376be976c5480710d29a77357ee
    container_name: dafeiyu-napcat
    hostname: qq-ai-runtime
    init: true
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:6099:6099"
      - "127.0.0.1:3001:3001"
    volumes:
      - ./config:/app/napcat/config
      - ./qq-container-entrypoint.sh:/qq-entrypoint.sh:ro
      - qq-ai-data:/app/.config/QQ
    entrypoint: ["/bin/bash", "/qq-entrypoint.sh"]
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"

  backend:
    image: dafeiyu-backend:0.1.0
    container_name: dafeiyu-backend
    network_mode: host
    init: true
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - napcat
    environment:
      # 必须显式指定，否则 state.json 落在容器可写层，重建容器即丢失
      DAFEIYU_DATA_DIR: /data
      DAFEIYU_RESOURCES: /app/Resources
      TZ: Asia/Shanghai
    volumes:
      # 宿主机目录需属于容器运行用户 UID 10001，见部署手册 4.2
      - ./data:/data
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  # QQ 登录态。删掉这个卷等于要重新扫码。
  qq-ai-data:
